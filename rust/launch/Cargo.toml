[package]
name = "vivi-launch"
version = "0.1.3"
edition = "2021"
publish = false
description = "Starts the ValDex catalog server, then the player window."
license = "GPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "vivi-start"
path = "src/main.rs"
