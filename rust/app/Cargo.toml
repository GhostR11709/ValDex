[package]
name = "vivi"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Windows player. Catalogs that are not ported yet still come from the Next.js server."
publish = false

[dependencies]
dirs = "6"
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rodio = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Playback", "Storage_Streams", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
